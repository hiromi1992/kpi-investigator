<!doctype html><html lang="ja"><head><meta charset="utf-8"/></head>
<body style="background:transparent;margin:0">
<script>
// A Streamlit component: a random browser-local identifier; no user input is sent to another server.
const KEY="kpi-investigator-browser-id-v1";
function browserId(){
  try{
    let id=localStorage.getItem(KEY);
    if(!/^[a-f0-9]{32}$/.test(id||"")){
      const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);
      id=Array.from(bytes,b=>b.toString(16).padStart(2,"0")).join("");localStorage.setItem(KEY,id);
    }
    return id;
  }catch(e){return null;}
}
window.addEventListener("message",event=>{
  if(event.data?.type!=="streamlit:render")return;
  window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setComponentValue",value:browserId()},"*");
  window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setFrameHeight",height:0},"*");
});
window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:componentReady",apiVersion:1},"*");
</script></body></html>
